  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 18px; }
  .brand-text { font-weight: 800; font-size: 14px; }
  .brand-text small { display: block; color: #94a3b8; font-size: 10px; font-weight: 500; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn-ghost { background: #f1f5f9; color: #64748b; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
  .device-btn { padding: 6px 12px; border-radius: 6px; border: none; background: transparent; font-size: 11px; font-weight: 700; color: #64748b; cursor: pointer; font-family: inherit; }
  .device-btn.active { background: #0f172a; color: #fff; }
  .main { flex: 1; display: flex; overflow: hidden; }
  .sidebar { width: 340px; background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; flex-shrink: 0; padding: 16px; }
  .section-label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; margin-top: 16px; }
  .section-label:first-child { margin-top: 0; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .cat-btn { padding: 8px 6px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; font-size: 11px; font-weight: 600; color: #64748b; cursor: pointer; font-family: inherit; text-align: center; }
  .cat-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }
  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tpl-card { border: 2px solid #e2e8f0; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .tpl-card.active { border-color: #6366f1; }
  .tpl-img { height: 70px; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; padding: 4px; }
  .tpl-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
  .tpl-img > * { position: relative; z-index: 1; color: #fff; }
  .tpl-emoji { font-size: 14px; }
  .tpl-name { font-size: 9px; font-weight: 800; }
  .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .style-btn { padding: 8px 4px; border-radius: 8px; border: 2px solid #e2e8f0; background: #fff; font-size: 9px; font-weight: 700; color: #64748b; cursor: pointer; font-family: inherit; }
  .style-btn.active { border-color: #6366f1; background: #eef2ff; color: #6366f1; }
  .style-emoji { font-size: 16px; display: block; margin-bottom: 2px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 7px; font-size: 12px; font-family: inherit; background: #fff; color: #0f172a; }
  .field textarea { resize: vertical; min-height: 60px; }
  .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 12px; }
  .color-swatch { height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .preview { flex: 1; background: #e2e8f0; padding: 16px; overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
  .preview-frame { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(15,23,42,0.15); width: 100%; max-width: 1000px; height: 100%; border: 1px solid #cbd5e1; }

  .tab { flex: 1; padding: 12px 4px; background: #fff; border: none; font-size: 10px; font-weight: 700; color: #64748b; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; }
  .tab.active { color: #6366f1; border-bottom-color: #6366f1; }
  .tab i { display: block; font-size: 14px; margin-bottom: 2px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9999; }

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <div class="brand-text">SmartBuild<small>Professional Builder</small></div>
  </div>
  <div style="display: flex; gap: 4px;">
    <button class="device-btn active" onclick="setDevice('desktop', this)"><i class="fas fa-desktop"></i></button>
    <button class="device-btn" onclick="setDevice('tablet', this)"><i class="fas fa-tablet-alt"></i></button>
    <button class="device-btn" onclick="setDevice('mobile', this)"><i class="fas fa-mobile-alt"></i></button>
  </div>
  <div class="actions">
    <a href="/dashboard.html" class="btn btn-ghost"><i class="fas fa-th-large"></i> Dashboard</a>
    <button onclick="publish()" class="btn btn-primary"><i class="fas fa-check"></i> Publish</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('templates', this)"><i class="fas fa-palette"></i>Templates</button>
      <button class="tab" onclick="switchTab('content', this)"><i class="fas fa-edit"></i>Content</button>
      <button class="tab" onclick="switchTab('design', this)"><i class="fas fa-cog"></i>Design</button>
    </div>

    <div id="panel-templates" class="panel active">
      <div class="section-label">1. Business Type</div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="section-label">2. Choose Template</div>
      <div class="tpl-grid" id="tplGrid"></div>
      <div class="section-label">3. Design Style</div>
      <div class="style-grid" id="styleGrid"></div>
    </div>

    <div id="panel-content" class="panel">
      <div class="section-label">Business Info</div>
      <div class="field"><label>Business Name</label><input type="text" id="bizName" value="My Business" oninput="render()"></div>
      <div class="field"><label>Tagline</label><input type="text" id="bizTagline" value="" oninput="render()"></div>
      <div class="field"><label>About Us</label><textarea id="bizAbout" oninput="render()"></textarea></div>
      <div class="section-label">Contact</div>
      <div class="field"><label>WhatsApp</label><input type="text" id="bizWhatsapp" value="+923001234567" oninput="render()"></div>
      <div class="field"><label>Phone</label><input type="text" id="bizPhone" value="+92 21 3456789" oninput="render()"></div>
      <div class="field"><label>Email</label><input type="email" id="bizEmail" value="info@business.pk" oninput="render()"></div>
      <div class="field"><label>Address</label><input type="text" id="bizAddress" value="Karachi, Pakistan" oninput="render()"></div>
    </div>

    <div id="panel-design" class="panel">
      <div class="section-label">Brand Color</div>
      <input type="color" id="bizColor" value="#6366f1" oninput="render()" style="width:100%; height:36px; border-radius:8px; border:1px solid #e2e8f0; cursor:pointer; margin-bottom:8px;">
      <div class="color-grid">
        <div class="color-swatch" onclick="setColor('#6366f1')" style="background:#6366f1;"></div>
        <div class="color-swatch" onclick="setColor('#8b5cf6')" style="background:#8b5cf6;"></div>
        <div class="color-swatch" onclick="setColor('#ec4899')" style="background:#ec4899;"></div>
        <div class="color-swatch" onclick="setColor('#ef4444')" style="background:#ef4444;"></div>
        <div class="color-swatch" onclick="setColor('#f59e0b')" style="background:#f59e0b;"></div>
        <div class="color-swatch" onclick="setColor('#10b981')" style="background:#10b981;"></div>
        <div class="color-swatch" onclick="setColor('#14b8a6')" style="background:#14b8a6;"></div>
        <div class="color-swatch" onclick="setColor('#0ea5e9')" style="background:#0ea5e9;"></div>
        <div class="color-swatch" onclick="setColor('#3b82f6')" style="background:#3b82f6;"></div>
        <div class="color-swatch" onclick="setColor('#1e293b')" style="background:#1e293b;"></div>
        <div class="color-swatch" onclick="setColor('#dc2626')" style="background:#dc2626;"></div>
        <div class="color-swatch" onclick="setColor('#7c3aed')" style="background:#7c3aed;"></div>
      </div>
      <div class="section-label">Font</div>
      <div class="field">
        <select id="bizFont" onchange="render()">
          <option value="Inter">Inter (Modern)</option>
          <option value="Georgia">Georgia (Classic)</option>
          <option value="Arial">Arial (Clean)</option>
        </select>
      </div>
    </div>
  </aside>

  <main class="preview">
    <div class="preview-frame" id="previewFrame">
      <iframe id="previewIframe"></iframe>
    </div>
  </main>
</div>

// ============================================================
// STATE
// ============================================================
var activeCategory = 'portfolio';
var activeTemplateId = 'pf1';
var activeStyle = 'modern';
var currentTemplate = null;
var currentLiveHtml = '';
var savedSlug = '';

// ============================================================
// RENDER CATEGORIES
// ============================================================
function renderCategories() {
  var grid = document.getElementById('catGrid');
  grid.innerHTML = Object.keys(CATEGORIES).map(function(k) {
    var c = CATEGORIES[k];
    return '<button class="cat-btn ' + (k === activeCategory ? 'active' : '') + '" onclick="changeCategory(\'' + k + '\')">' + c.emoji + ' ' + c.name + '</button>';
  }).join('');
}

function changeCategory(cat) {
  activeCategory = cat;
  var list = TEMPLATES[cat] || [];
  if (list.length > 0) {
    activeTemplateId = list[0].id;
  }
  renderCategories();
  renderTemplates();
  useTemplate(activeTemplateId);
}

// ============================================================
// RENDER TEMPLATES
// ============================================================
function renderTemplates() {
  var list = TEMPLATES[activeCategory] || [];
  var grid = document.getElementById('tplGrid');
  if (list.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; font-size:11px; color:#94a3b8; padding:12px;">Coming soon</p>';
    return;
  }
  grid.innerHTML = list.map(function(t) {
    var sel = activeTemplateId === t.id ? 'active' : '';
    return '<div class="tpl-card ' + sel + '" onclick="useTemplate(\'' + t.id + '\')">' +
      '<div class="tpl-img" style="background-image:url(\'' + t.img + '\')">' +
        '<div><div class="tpl-emoji">' + t.emoji + '</div><div class="tpl-name">' + t.name + '</div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ============================================================
// RENDER STYLES
// ============================================================
function renderStyles() {
  var grid = document.getElementById('styleGrid');
  grid.innerHTML = STYLES.map(function(s) {
    return '<button class="style-btn ' + (s.key === activeStyle ? 'active' : '') + '" onclick="setStyle(\'' + s.key + '\', this)">' +
      '<span class="style-emoji">' + s.emoji + '</span>' + s.name +
    '</button>';
  }).join('');
}

function setStyle(style, el) {
  activeStyle = style;
  document.querySelectorAll('.style-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  render();
}

// ============================================================
// USE TEMPLATE
// ============================================================
function useTemplate(id) {
  var list = TEMPLATES[activeCategory] || [];
  var t = list.find(function(x) { return x.id === id; });
  if (!t) return;
  currentTemplate = t;
  activeTemplateId = id;

  document.getElementById('bizName').value = t.name;
  document.getElementById('bizTagline').value = t.hero.subtitle;
  document.getElementById('bizAbout').value = t.about;
  document.getElementById('bizColor').value = t.color;

  renderTemplates();
  render();
  showToast('✓ ' + t.name + ' applied');
}

// ============================================================
// TABS / DEVICE / COLOR
// ============================================================
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('panel-' + tab).classList.add('active');
}

function setDevice(device, el) {
  document.querySelectorAll('.device-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  var f = document.getElementById('previewFrame');
  if (device === 'tablet') f.style.maxWidth = '600px';
  else if (device === 'mobile') f.style.maxWidth = '375px';
  else f.style.maxWidth = '1000px';
}

function setColor(color) {
  document.getElementById('bizColor').value = color;
  render();
}

// ============================================================
// HELPERS
// ============================================================
function esc(s) { return String(s || '').replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function stars(n) { var s = ''; for (var i = 0; i < (n || 5); i++) s += '★'; return s; }

function isCafe() { return activeCategory === 'cafe'; }
function isRestaurant() { return activeCategory === 'restaurant'; }

// ============================================================
// RENDER PREVIEW — CATEGORY-SPECIFIC
// ============================================================
function render() {
  if (!currentTemplate) { currentTemplate = TEMPLATES[activeCategory][0]; }
  var t = currentTemplate;

  var name = document.getElementById('bizName').value || 'Business';

  var about = document.getElementById('bizAbout').value || t.about || '';
  var whatsapp = document.getElementById('bizWhatsapp').value || '';
  var phone = document.getElementById('bizPhone').value || '';
  var email = document.getElementById('bizEmail').value || '';
  var address = document.getElementById('bizAddress').value || '';
  var color = document.getElementById('bizColor').value;
  var font = document.getElementById('bizFont').value;
  var waNumber = whatsapp.replace(/[^0-9]/g, '');

    content = sectionNav() + sectionHero() + sectionInfo() + sectionServices(t.services, 'Medical Services') + sectionDoctors(t.doctors, 'Our Doctors') + sectionCategories(t.specialties) + sectionReviews(t.reviews) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }
  // School
  else if (activeCategory === 'school') {
    content = sectionNav() + sectionHero() + sectionInfo() + sectionServices(t.courses, 'Our Courses') + sectionDoctors(t.teachers, 'Our Teachers') + sectionCategories(t.facilities) + sectionGallery(t.gallery) + sectionReviews(t.reviews) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }
  // Gym
  else if (activeCategory === 'gym') {
    content = sectionNav() + sectionHero() + sectionInfo() + sectionPlans(t.plans) + sectionDoctors(t.trainers, 'Our Trainers') + sectionCategories(t.classes) + sectionCategories(t.facilities) + sectionReviews(t.reviews) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }
  // Salon
  else if (activeCategory === 'salon') {
    content = sectionNav() + sectionHero() + sectionInfo() + sectionServices(t.services, 'Our Services') + sectionPlans(t.packages) + sectionDoctors(t.stylists, 'Our Stylists') + sectionGallery(t.gallery) + sectionReviews(t.reviews) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }
  // Real Estate
  else if (activeCategory === 'realestate') {
    content = sectionNav() + sectionHero() + sectionInfo() + sectionCategories(t.categories) + sectionProducts(t.properties, 'Available Properties') + sectionDoctors(t.agents, 'Our Agents') + sectionCategories(t.locations) + sectionReviews(t.reviews) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }
  else {
    content = sectionNav() + sectionHero() + sectionProducts(t.products || t.menu || t.services) + sectionAbout(about) + sectionContact() + sectionFooter() + floatingWhatsapp();
  }

  var fullHTML = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(name) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=' + font.replace(/ /g, '+') + ':wght@400;600;700;800;900&display=swap" rel="stylesheet">' +
    '<style>*{margin:0;padding:0;box-sizing:border-box;font-family:"' + font + '",-apple-system,sans-serif;}html{scroll-behavior:smooth;}body{background:' + d.bg + ';color:' + d.txt + ';line-height:1.6;}@media(max-width:768px){section{padding:60px 20px!important;}h1{font-size:36px!important;}h2{font-size:28px!important;}}</style>' +
    '</head><body>' + content + '</body></html>';

  currentLiveHtml = fullHTML;

  var iframe = document.getElementById('previewIframe');
  var doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(fullHTML);
  doc.close();
}

// ============================================================
// PUBLISH
// ============================================================
async function publish() {
  var name = document.getElementById('bizName').value.trim();
  if (!name) { showToast('❌ Business name required'); return; }

  try {
    var headers = { 'Content-Type': 'application/json' };
    var token = localStorage.getItem('token');
    if (token) headers['Authorization'] = 'Bearer ' + token;

    var res = await fetch('/api/sites', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ name: name, html: currentLiveHtml, category: activeCategory, style: activeStyle })
    });

    var data = await res.json();
    if (!res.ok) { showToast('❌ ' + (data.error || 'Publish failed')); return; }

    savedSlug = data.slug;
    var url = window.location.origin + data.url;
    var open = confirm('✅ Published!\n\nURL: ' + url + '\n\nOpen it now?');
    if (open) window.open(url, '_blank');
    showToast('✓ Published');
  } catch (e) { showToast('❌ Network error'); }
}

function showToast(msg) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}
